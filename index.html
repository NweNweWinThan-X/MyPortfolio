                  e('span'), e('span'), e('span'), e('span'), e('span'), e('span')
                ),
                e('div', { className: 'relative z-10' },
                  e(SectionTitle, null, 'Summary'),
                  e('p', { className: 'text-slate-300 leading-7' }, data.summary)
                )
              ),
              e('div', { className: 'grid grid-cols-2 gap-4 content-start' },
                data.metrics.map((m) => e('div', { key: m.label, className: 'rounded-3xl border border-white/10 bg-slate-900/80 p-5' },
                  e('p', { className: 'text-3xl font-semibold text-white' }, m.value),
                  e('p', { className: 'mt-1 text-xs uppercase tracking-wider text-slate-500' }, m.label)
                ))
              )
            ),

            /* ---------- skills ---------- */
            e('section', null,
              e(Card, null,
                e(SectionTitle, { id: 'skills' }, 'Core Skills'),
                e('p', { className: 'mb-5 text-xs text-slate-500' },
                  active.size
                    ? `${active.size} selected — highlighted in the experience below`
                    : 'Tap any technology to highlight where it was used'
                ),
                e('div', { className: 'space-y-4' },
                  data.skillCategories.map((cat) => e('div', { key: cat.title, className: 'sm:flex sm:gap-4' },
                    e('p', { className: 'shrink-0 sm:w-36 text-xs uppercase tracking-wider text-slate-500 mb-2 sm:mb-0 sm:pt-1.5' }, cat.title),
                    e('div', { className: 'flex flex-wrap gap-2' },
                      cat.items.map((item) => e('button', {
                        key: item, type: 'button', onClick: () => toggle(item),
                        className: `rounded-full px-3 py-1.5 text-sm transition ${active.has(item)
                          ? 'bg-sky-500 text-slate-950 font-medium'
                          : 'bg-slate-950/70 text-slate-300 hover:bg-slate-800 hover:text-white'}`
                      }, item))
                    )
                  )),
                  e('div', { className: 'sm:flex sm:gap-4 pt-2 border-t border-white/5' },
                    e('p', { className: 'shrink-0 sm:w-36 text-xs uppercase tracking-wider text-amber-500/70 mb-2 sm:mb-0 sm:pt-1.5' }, 'Learning now'),
                    e('div', { className: 'flex flex-wrap gap-2' },
                      data.learning.map((item) => e('span', {
                        key: item,
                        className: 'rounded-full border border-amber-400/20 bg-amber-500/5 px-3 py-1.5 text-sm text-amber-200/70'
                      }, item))
                    )
                  )
                )
              )
            ),

            /* ---------- experience ---------- */
            e('section', null,
              e(SectionTitle, { id: 'experience' }, 'Experience'),
              e('div', { className: 'space-y-5' },
                data.experiences.map((job) => e(Card, { key: job.company },
                  e('div', { className: 'flex flex-wrap items-baseline justify-between gap-2 pb-5 mb-5 border-b border-white/5' },
                    e('div', null,
                      e('div', { className: 'flex items-center gap-2' },
                        e('h3', { className: 'text-lg font-semibold text-white' }, job.title),
                        job.current && e('span', { className: 'rounded-full bg-emerald-500/15 px-2 py-0.5 text-[10px] uppercase tracking-wider text-emerald-300' }, 'Current')
                      ),
                      e('p', { className: 'mt-1 text-sm text-slate-400' }, job.company + ' · ' + job.location)
                    ),
                    e('div', { className: 'text-right' },
                      e('p', { className: 'text-sm text-slate-300' }, job.period),
                      e('p', { className: 'text-xs text-slate-500' }, job.stack)
                    )
                  ),
                  e('div', { className: 'space-y-7' },
                    job.projects.map((p) => e(ProjectBlock, { key: p.name, project: p, highlight: active }))
                  )
                ))
              )
            ),

            /* ---------- selected project ---------- */
            e('section', null,
              e(SectionTitle, { id: 'project' }, 'Selected Project'),
              e(Card, { className: 'border-sky-200/20' },
                e('div', { className: 'flex flex-wrap items-start justify-between gap-4' },
                  e('div', null,
                    e('h3', { className: 'text-lg font-semibold text-white font-mono' }, data.project.name),
                    e('a', {
                      href: data.project.href, target: '_blank', rel: 'noreferrer',
                      className: 'text-sm text-sky-300 hover:text-sky-200'
                    }, 'View on GitHub →')
                  ),
                  e('div', { className: 'flex gap-5' },
                    data.project.stats.map((s) => e('div', { key: s.label, className: 'text-right' },
                      e('p', { className: 'text-2xl font-semibold text-white' }, s.value),
                      e('p', { className: 'text-[10px] uppercase tracking-wider text-slate-500' }, s.label)
                    ))
                  )
                ),
                e('p', { className: 'mt-4 text-slate-300 leading-7' }, data.project.blurb),
                e('div', { className: 'mt-5 space-y-3' },
                  data.project.facets.map((f) => e('div', { key: f.label, className: 'sm:flex sm:gap-4' },
                    e('p', { className: 'shrink-0 sm:w-32 text-xs uppercase tracking-wider text-sky-400/80 mb-1 sm:mb-0 sm:pt-0.5' }, f.label),
                    e('p', { className: 'text-sm text-slate-300 leading-6' }, f.body)
                  ))
                )
              )
            ),

            /* ---------- education / certs / languages ---------- */
            e('section', { className: 'grid gap-5 md:grid-cols-3' },
              e(Card, null,
                e(SectionTitle, null, 'Education'),
                e('p', { className: 'font-semibold text-white leading-6' }, data.education.degree),
                e('p', { className: 'mt-2 text-sm text-slate-300' }, data.education.school),
                e('p', { className: 'text-sm text-slate-500' }, data.education.country),
                e('p', { className: 'mt-2 text-xs text-slate-500' }, data.education.period)
              ),
              e(Card, null,
                e(SectionTitle, null, 'Certifications'),
                e(CertTimeline, { items: data.certifications })
              ),
              e(Card, null,
                e(SectionTitle, null, 'Languages'),
                e('div', { className: 'space-y-3' },
                  data.languages.map((l) => e('div', { key: l.name },
                    e('p', { className: 'text-sm text-slate-200' }, l.name),
                    e('p', { className: 'text-xs text-slate-500 leading-5' }, l.level)
                  ))
                )
              )
            )
          ),

          e('footer', { className: 'mt-16 pt-8 border-t border-white/5 flex flex-wrap items-center justify-between gap-3 text-xs text-slate-600' },
            e('p', null, data.name + ' · ' + data.location),
            e('p', null, 'Updated October 2026')
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
