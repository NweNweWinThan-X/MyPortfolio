    .snow-scene {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    .snow-scene span {
      position: absolute;
      top: -10px;
      left: 50%;
      width: 6px;
      height: 6px;
      background: rgba(255,255,255,0.9);
      border-radius: 9999px;
      filter: drop-shadow(0 0 4px rgba(255,255,255,0.7));
      opacity: 0.8;
      transform-origin: center;
      animation: fall 6s linear infinite, sway 3s ease-in-out infinite;
    }

    .snow-scene span:nth-child(2) { left: 20%; animation-delay: 0.8s; animation-duration: 7s; transform: translateZ(20px); }
    .snow-scene span:nth-child(3) { left: 85%; animation-delay: 1.4s; animation-duration: 6.5s; transform: translateZ(-20px); }
    .snow-scene span:nth-child(4) { left: 35%; animation-delay: 0.3s; animation-duration: 5.5s; transform: translateZ(30px); }
    .snow-scene span:nth-child(5) { left: 65%; animation-delay: 1.1s; animation-duration: 7.2s; transform: translateZ(-15px); }
    .snow-scene span:nth-child(6) { left: 10%; animation-delay: 0.5s; animation-duration: 6.8s; transform: translateZ(10px); }

    @keyframes fall {
      0% { transform: translate3d(0, -10px, 0) rotateX(0deg) rotateY(0deg); opacity: 0.8; }
      100% { transform: translate3d(-25px, 260px, 80px) rotateX(360deg) rotateY(180deg); opacity: 0.2; }
    }

    @keyframes sway {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(18px); }
    }
  </style>
